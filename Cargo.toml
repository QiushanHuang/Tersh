[package]
name = "tersh"
version = "0.1.0"
edition = "2024"
description = "A lightweight terminal file workbench for local and SSH shell sessions."
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28.1"
ratatui = "0.29"

[dev-dependencies]
tempfile = "3"
