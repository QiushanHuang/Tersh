name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Tests (${{ matrix.os }}, Rust 1.88)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.88.0 fmt --check
      - run: cargo +1.88.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.88.0 test --locked --all-targets
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

  binaries:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            platform: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --target ${{ matrix.target }}
      - name: Build locked release
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_TARGET" == *linux-musl ]]; then
            host=$(rustc +1.88.0 -vV | sed -n 's/^host: //p')
            linker="$(rustc +1.88.0 --print sysroot)/lib/rustlib/$host/bin/rust-lld"
            target_env=$(printf '%s' "$BUILD_TARGET" | tr '[:lower:]-' '[:upper:]_')
            export "CARGO_TARGET_${target_env}_LINKER=$linker"
            export "CARGO_TARGET_${target_env}_RUSTFLAGS=-C linker-flavor=ld.lld"
          fi
          cargo +1.88.0 build --locked --release --target "$BUILD_TARGET" --bin tersh
      - name: Smoke native release binary
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          release_binary="target/$BUILD_TARGET/release/tersh"
          file "$release_binary"
          case "$BUILD_TARGET:$(uname -m)" in
            aarch64-apple-darwin:arm64|x86_64-unknown-linux-musl:x86_64|aarch64-unknown-linux-musl:aarch64)
              "$release_binary" --version
              "$release_binary" --help
              "$release_binary" --dump-keymap > release-keymap.json
              python3 - <<'PY'
          import json
          from pathlib import Path
          keymap = json.loads(Path("release-keymap.json").read_text())
          for context in ("cluster", "cluster_detail"):
              assert "H" in keymap[context]["open_hardware"], context
          PY
              ;;
            *) echo "Cross-compiled binary; runtime check requires matching hardware." ;;
          esac
      - name: Package
        run: python3 scripts/package-release.py target/${{ matrix.target }}/release/tersh ${{ matrix.platform }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tersh-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
